# .pre-commit-config.yaml
# Install pre-commit with: pip install pre-commit
# Setup with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ============================================================
  # General Git Checks
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  # ============================================================
  # Python: Formatting & Linting
  # ============================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ============================================================
  # Python: Type Checking
  # ============================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: ['types-all']

  # ============================================================
  # Security: Bandit
  # ============================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-ll]

  # ============================================================
  # JavaScript/TypeScript: Formatting & Linting
  # ============================================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, typescript, tsx, json, css]
        additional_dependencies: ['prettier', '@tailwindcss/prettier-plugin']

  # ============================================================
  # Markdown: Formatting & Linting
  # ============================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: ['--fix']

  # ============================================================
  # YAML: Formatting
  # ============================================================
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.10.0
    hooks:
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2']

  # ============================================================
  # Docker: Linting
  # ============================================================
  - repo: https://github.com/hadialqattan/pylint-django
    rev: pylint-django-2.5.5
    hooks:
      - id: pylint
        name: pylint-python
        entry: pylint
        language: python
        types: [python]
        args: [--disable=all, --enable=E,F]

# ============================================================
# Configuration
# ============================================================
default_language_version:
  python: python3.11
  node: '20'

exclude: |
  (?x)^(
    frontend/node_modules/|
    data/|
    models/|
    mlruns/|
    artifacts/
  )
