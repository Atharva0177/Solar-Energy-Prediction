name: Performance & Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run performance tests weekly
    - cron: '0 0 * * 0'

jobs:
  # ============================================================
  # ML Model Performance Benchmarks
  # ============================================================
  ml-benchmarks:
    name: ML Model Benchmarks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-benchmark pytest-xdist
          pip install -r requirements.txt
      
      - name: Run model inference benchmarks
        run: |
          pytest tests/ -k benchmark --benchmark-json=benchmark.json -v
      
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
  
  # ============================================================
  # API Response Time Tests
  # ============================================================
  api-performance:
    name: API Performance Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-benchmark httpx fastapi uvicorn
          pip install -r requirements.txt
      
      - name: Start API server
        run: |
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
      
      - name: Run API performance tests
        run: |
          pytest tests/ -k "api and benchmark" -v || true
  
  # ============================================================
  # Frontend Build Performance
  # ============================================================
  frontend-performance:
    name: Frontend Build Performance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Measure build time
        run: |
          cd frontend
          /usr/bin/time -v npm run build 2>&1 | tee build-metrics.txt
      
      - name: Check bundle size
        run: |
          cd frontend
          npm install -g webpack-bundle-analyzer
          # Add bundle size analysis to your build
      
      - name: Upload build metrics
        uses: actions/upload-artifact@v4
        with:
          name: build-metrics
          path: frontend/build-metrics.txt
