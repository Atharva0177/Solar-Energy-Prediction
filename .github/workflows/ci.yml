name: CI - Test & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # Python: Linting, Type Checking, and Unit Tests
  # ============================================================
  python-lint-test:
    name: Python Linting & Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ruff mypy pytest pytest-cov pytest-xdist
          pip install -r requirements.txt
      
      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ scripts/ --output-format=github
        continue-on-error: true
      
      - name: Format check with Ruff
        run: |
          ruff format --check src/ tests/ scripts/
        continue-on-error: true
      
      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports || true
        continue-on-error: true
      
      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junit-xml=junit.xml \
            -v \
            -n auto
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            junit.xml
            htmlcov/
  
  # ============================================================
  # Frontend: Linting, Type Checking, and Build
  # ============================================================
  frontend-lint-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run linter
        run: |
          cd frontend
          npm run lint
        continue-on-error: true
      
      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit
        continue-on-error: true
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
  
  # ============================================================
  # API Integration Tests
  # ============================================================
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: python-lint-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-asyncio httpx
          pip install -r requirements.txt
      
      - name: Run API tests
        run: |
          pytest tests/test_api.py -v
      
      - name: Run training API tests
        run: |
          pytest tests/test_train_api.py -v
  
  # ============================================================
  # ML Model Tests
  # ============================================================
  ml-model-tests:
    name: ML Model Tests
    runs-on: ubuntu-latest
    needs: python-lint-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest torch xgboost scikit-learn
          pip install -r requirements.txt
      
      - name: Test data modules
        run: |
          pytest tests/test_data_modules.py -v
      
      - name: Test baseline models
        run: |
          pytest tests/test_baselines.py -v
      
      - name: Test XGBoost model
        run: |
          pytest tests/test_xgboost_model.py -v
      
      - name: Test sequence models
        run: |
          pytest tests/test_sequence_model.py -v
      
      - name: Test Transformer model
        run: |
          pytest tests/test_transformer_model.py -v
      
      - name: Test temporal features
        run: |
          pytest tests/test_features.py -v
      
      - name: Test leakage detection
        run: |
          pytest tests/test_leakage.py -v
  
  # ============================================================
  # Data & Cross-site Tests
  # ============================================================
  data-tests:
    name: Data & Cross-site Tests
    runs-on: ubuntu-latest
    needs: python-lint-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest
          pip install -r requirements.txt
      
      - name: Test cross-site evaluation
        run: |
          pytest tests/test_cross_site.py -v
      
      - name: Test conformal prediction
        run: |
          pytest tests/test_conformal.py -v
      
      - name: Test export bundles
        run: |
          pytest tests/test_export_bundles.py -v
  
  # ============================================================
  # Security: Dependency Scanning
  # ============================================================
  security-deps:
    name: Security - Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt || true
      
      - name: Check for known vulnerabilities
        run: |
          pip install safety
          safety check --file requirements.txt --json || true
  
  # ============================================================
  # Summary Job
  # ============================================================
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [python-lint-test, frontend-lint-build, api-tests, ml-model-tests, data-tests]
    if: always()
    
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.python-lint-test.result }}" == "failure" || \
                "${{ needs.frontend-lint-build.result }}" == "failure" || \
                "${{ needs.api-tests.result }}" == "failure" || \
                "${{ needs.ml-model-tests.result }}" == "failure" || \
                "${{ needs.data-tests.result }}" == "failure" ]]; then
            echo "CI Pipeline Failed"
            exit 1
          else
            echo "CI Pipeline Passed"
          fi
