version: '3.8'

services:
  # ============================================================
  # Backend API Service
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: solar-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: info
      # Add your environment variables here
      # DATABASE_URL: "postgresql://user:password@db:5432/solar"
      # MLFLOW_TRACKING_URI: "http://mlflow:5000"
    volumes:
      - ./src:/app/src:ro
      - ./api:/app/api:ro
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./artifacts:/app/artifacts:ro
    depends_on:
      - db
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - solar-network

  # ============================================================
  # Frontend Service
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: solar-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/nginx.pid || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - solar-network

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: solar-db
    environment:
      POSTGRES_USER: ${DB_USER:-solar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-solar}
      POSTGRES_DB: ${DB_NAME:-solar}
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-solar} -d ${DB_NAME:-solar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar-network

  # ============================================================
  # MLflow Tracking Server
  # ============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: solar-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    command: mlflow server --host 0.0.0.0 --backend-store-uri file:///mlflow/store
    networks:
      - solar-network

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: solar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar-network

  # ============================================================
  # Prometheus Monitoring
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: solar-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - solar-network

  # ============================================================
  # Grafana Dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: solar-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - solar-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  solar-network:
    driver: bridge
